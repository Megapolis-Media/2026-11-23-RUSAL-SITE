server {
    listen 192.168.0.141:443 ssl;
    http2 on;
    server_name rusal.knzteam.ru;
    ssl_certificate /etc/letsencrypt/live/rusal.knzteam.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rusal.knzteam.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:18178;
        proxy_http_version 1.1;
        proxy_set_header Host rusal.knzteam.ru;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Oai-Authenticated-User-Id "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
